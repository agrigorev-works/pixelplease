<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pixelplease - pixel font generator</title>
    <meta
      name="description"
      content="Upload a font, pixelize its glyphs in your browser, preview the result, and export a test TTF package. No server upload."
    />
    <meta name="robots" content="index, follow" />
    <meta name="application-name" content="pixelplease" />
    <meta name="apple-mobile-web-app-title" content="pixelplease" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="canonical" href="https://pixelplease.tools/" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="pixelplease" />
    <meta property="og:title" content="pixelplease - pixel font generator" />
    <meta property="og:url" content="https://pixelplease.tools/" />
    <meta
      property="og:description"
      content="Upload a font, pixelize its glyphs in your browser, preview the result, and export a test TTF package."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="pixelplease - pixel font generator" />
    <meta
      name="twitter:description"
      content="Upload a font, pixelize its glyphs in your browser, preview the result, and export a test TTF package."
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "pixelplease",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Web",
        "description": "A browser-based pixel font generator for previewing and exporting test TTF packages.",
        "url": "https://pixelplease.tools/"
      }
    </script>
  </head>
  <body>
    <main id="app" class="app-shell">
      <p id="app-status" aria-live="polite" hidden></p>

      <header class="intro">
        <h1 id="logo-title" aria-label=""><span></span><span></span></h1>
        <p class="intro-copy"></p>
      </header>

      <div class="workspace">
        <section class="source-panel preview-pane" aria-label="">
          <fieldset class="source-mode-control" aria-label="">
            <legend class="sr-only"></legend>
            <label class="segment-option">
              <input id="source-mode-google" type="radio" name="source-mode" value="google" checked />
              <span></span>
            </label>
            <label class="segment-option">
              <input id="source-mode-upload" type="radio" name="source-mode" value="upload" />
              <span></span>
            </label>
          </fieldset>

          <div class="source-toolbar">
            <label id="google-font-field" class="font-select-field" for="google-font-select">
              <select id="google-font-select"></select>
            </label>

            <button id="replace-font-button" class="replace-font-button is-hidden" type="button"></button>
          </div>

          <label id="source-editor-field" class="source-editor-field" for="sample-text">
            <span class="sr-only"></span>
            <textarea id="sample-text" class="preview-text source-editor" rows="8" autofocus></textarea>
          </label>

          <label id="upload-zone" class="upload-zone is-hidden" for="font-upload">
            <span class="upload-title"></span>
            <span class="license-reminder"></span>
          </label>
          <input id="font-upload" class="font-upload-input" type="file" accept=".ttf,.otf,font/ttf,font/otf" />
        </section>

        <section class="output-panel preview-pane" aria-label="">
          <div id="demo-preview-frame" class="demo-preview-frame">
            <canvas id="demo-preview-canvas" class="demo-preview-canvas" aria-label=""></canvas>
          </div>
          <p id="after-preview" class="preview-text generated-preview is-hidden"></p>
        </section>

        <aside class="controls-panel" aria-label="">
          <div class="control-stack">
            <label class="field">
              <span></span>
              <output id="pixels-per-em-value"></output>
              <input id="pixels-per-em" type="range" min="10" max="40" step="1" value="20" />
            </label>

            <label class="field">
              <span></span>
              <output id="threshold-value"></output>
              <input id="threshold" type="range" min="12" max="78" step="1" value="42" />
            </label>

            <label class="field">
              <span></span>
              <output id="expand-value"></output>
              <input id="expand" type="range" min="0" max="3" step="1" value="0" />
            </label>

            <label class="field">
              <span></span>
              <output id="shift-x-value"></output>
              <input id="shift-x" type="range" min="-0.5" max="0.5" step="0.05" value="0" />
            </label>

            <label class="field">
              <span></span>
              <output id="shift-y-value"></output>
              <input id="shift-y" type="range" min="-0.5" max="0.5" step="0.05" value="0" />
            </label>
          </div>

          <div class="action-stack">
            <button id="reset-button" class="secondary-action" type="button"></button>

            <a id="download-link" class="download-action is-disabled" href="#" download=""></a>
          </div>
        </aside>
      </div>

      <footer class="site-footer" aria-label="">
        <p class="footer-copy"></p>
      </footer>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
