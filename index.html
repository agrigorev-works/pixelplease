<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400&family=Lato:wght@400&family=Libre+Baskerville:wght@400&family=Merriweather:wght@400&family=Roboto+Mono:wght@400&family=Space+Grotesk:wght@400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main id="app" class="app-shell">
      <p id="app-status" aria-live="polite" hidden></p>

      <header class="intro">
        <h1 id="logo-title" aria-label=""><span></span><span></span></h1>
        <p class="intro-copy"></p>
      </header>

      <div class="workspace">
        <section class="source-panel preview-pane" aria-label="">
          <fieldset class="source-mode-control" aria-label="">
            <legend class="sr-only"></legend>
            <label class="segment-option">
              <input id="source-mode-google" type="radio" name="source-mode" value="google" checked />
              <span></span>
            </label>
            <label class="segment-option">
              <input id="source-mode-upload" type="radio" name="source-mode" value="upload" />
              <span></span>
            </label>
          </fieldset>

          <div class="source-toolbar">
            <label id="google-font-field" class="font-select-field" for="google-font-select">
              <select id="google-font-select"></select>
            </label>

            <button id="replace-font-button" class="replace-font-button is-hidden" type="button"></button>
          </div>

          <label id="source-editor-field" class="source-editor-field" for="sample-text">
            <span class="sr-only"></span>
            <textarea id="sample-text" class="preview-text source-editor" rows="8" autofocus></textarea>
          </label>

          <label id="upload-zone" class="upload-zone is-hidden" for="font-upload">
            <span class="upload-title"></span>
            <span class="license-reminder"></span>
          </label>
          <input id="font-upload" class="font-upload-input" type="file" accept=".ttf,.otf,font/ttf,font/otf" />
        </section>

        <section class="output-panel preview-pane" aria-label="">
          <canvas id="demo-preview-canvas" class="demo-preview-canvas" aria-label=""></canvas>
          <p id="after-preview" class="preview-text generated-preview is-hidden"></p>
        </section>

        <aside class="controls-panel" aria-label="">
          <div class="control-stack">
            <label class="field">
              <span></span>
              <output id="pixels-per-em-value"></output>
              <input id="pixels-per-em" type="range" min="10" max="40" step="1" value="20" />
            </label>

            <label class="field">
              <span></span>
              <output id="threshold-value"></output>
              <input id="threshold" type="range" min="12" max="78" step="1" value="42" />
            </label>

            <label class="field">
              <span></span>
              <output id="expand-value"></output>
              <input id="expand" type="range" min="0" max="3" step="1" value="0" />
            </label>

            <label class="field">
              <span></span>
              <output id="shift-x-value"></output>
              <input id="shift-x" type="range" min="-0.5" max="0.5" step="0.05" value="0" />
            </label>

            <label class="field">
              <span></span>
              <output id="shift-y-value"></output>
              <input id="shift-y" type="range" min="-0.5" max="0.5" step="0.05" value="0" />
            </label>
          </div>

          <div class="action-stack">
            <button id="reset-button" class="secondary-action" type="button"></button>

            <a id="download-link" class="download-action is-disabled" href="#" download=""></a>
          </div>
        </aside>
      </div>

    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
