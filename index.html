<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pixelplease</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400&family=Lato:wght@400&family=Libre+Baskerville:wght@400&family=Merriweather:wght@400&family=Roboto+Mono:wght@400&family=Space+Grotesk:wght@400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main id="app" class="app-shell">
      <p id="app-status" aria-live="polite" hidden>demo mode</p>

      <header class="intro">
        <p class="prompt-line">~/pixelplease $ font-to-pixel --local</p>
        <h1>pixelplease</h1>
        <p class="intro-copy">
          Upload a font, edit sample text, preview a pixel treatment, and export a test TTF.
        </p>
      </header>

      <div class="workspace">
        <section class="source-panel preview-pane" aria-label="Source font and text">
          <fieldset class="source-mode-control" aria-label="Source mode">
            <legend class="sr-only">Source mode</legend>
            <label class="segment-option">
              <input id="source-mode-google" type="radio" name="source-mode" value="google" checked />
              <span>Google Font</span>
            </label>
            <label class="segment-option">
              <input id="source-mode-upload" type="radio" name="source-mode" value="upload" />
              <span>Your Font</span>
            </label>
          </fieldset>

          <label id="google-font-field" class="font-select-field" for="google-font-select">
            <span>google font</span>
            <select id="google-font-select" aria-label="Google Font for demo preview"></select>
          </label>

          <label id="source-editor-field" class="source-editor-field" for="sample-text">
            <span class="sr-only">sample text</span>
            <textarea id="sample-text" class="preview-text source-editor" rows="8" autofocus>The quick brown fox jumps over 123.</textarea>
          </label>

          <label id="upload-zone" class="upload-zone is-hidden" for="font-upload">
            <span class="upload-title">choose font file</span>
            <span class="upload-copy">drop a TTF/OTF here or click anywhere in this area</span>
            <span class="license-reminder">Please use only fonts you have a license to edit.</span>
            <input id="font-upload" type="file" accept=".ttf,.otf,font/ttf,font/otf" />
          </label>
        </section>

        <section class="output-panel preview-pane" aria-label="Pixelized font preview">
          <canvas id="demo-preview-canvas" class="demo-preview-canvas" aria-label="Pixelized demo preview"></canvas>
          <p id="after-preview" class="preview-text generated-preview is-hidden">
            The quick brown fox jumps over 123.
          </p>
        </section>

        <aside class="controls-panel" aria-label="Settings">
          <div class="control-stack">
            <label class="field">
              <span>pixels-per-em</span>
              <output id="pixels-per-em-value">20</output>
              <input id="pixels-per-em" type="range" min="10" max="40" step="1" value="20" />
            </label>

            <label class="field">
              <span>threshold</span>
              <output id="threshold-value">42%</output>
              <input id="threshold" type="range" min="12" max="78" step="1" value="42" />
            </label>

            <label class="field">
              <span>expand</span>
              <output id="expand-value">0</output>
              <input id="expand" type="range" min="0" max="3" step="1" value="0" />
            </label>

            <label class="field">
              <span>shift-x</span>
              <output id="shift-x-value">0.00 cell</output>
              <input id="shift-x" type="range" min="-0.5" max="0.5" step="0.05" value="0" />
            </label>

            <label class="field">
              <span>shift-y</span>
              <output id="shift-y-value">0.00 cell</output>
              <input id="shift-y" type="range" min="-0.5" max="0.5" step="0.05" value="0" />
            </label>
          </div>

          <div class="action-stack">
            <button id="reset-button" class="secondary-action" type="button">
              reset defaults
            </button>

            <a id="download-link" class="download-action is-disabled" href="#" download="Pixelized-Test.ttf">
              Download TTF
            </a>
          </div>
        </aside>
      </div>

    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
